# One job: devkit's Python and repository gates, then the tests.
# `make lint` syncs .venv from uv.lock first, through lint-shell,
# installing the pinned uv hash-verified when devkit's cache lacks it.
# Actions are pinned by commit SHA; the comment names the tag it resolved
# from.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # lint-secrets scans the full history and refuses a shallow clone.
          fetch-depth: 0
      # Before the setup actions, which put tool-cache directories on PATH
      # ahead of the system's while the token is set.
      - uses: ./.gitea/actions/fetch-devkit
        timeout-minutes: 5
        with:
          token: ${{ secrets.DEVKIT_TOKEN }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          check-latest: true # not a cached 22.x below devkit's node floor
      # The runner's downloads from PyPI intermittently crawl, and every run
      # fetches the same wheels: the bootstrap's uv, then uv.lock's set.
      # Only a push to main saves, which keeps ordinary branch runs out of the
      # cache but cannot keep a branch out: act_runner scopes entries by
      # repository alone, and a branch runs its own copy of this file. That
      # is accepted, since a branch already runs with DEVKIT_TOKEN. The
      # restore-keys fallback carries the last lock's wheels into each new
      # entry, so a lock change downloads only its delta and the cache grows.
      - id: wheels
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: wheels-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}
          restore-keys: wheels-${{ runner.os }}-${{ runner.arch }}-
      - run: make lint
      - run: make test
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.wheels.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: ${{ steps.wheels.outputs.cache-primary-key }}
