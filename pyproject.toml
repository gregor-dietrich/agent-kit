[project]
name = "agent-kit"
version = "0.1.0"
description = "Test environment for the agent-kit plugin; the plugin itself is stdlib-only."
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    # Only where it ships a wheel (uv.lock); never built, see below.
    "shellcheck-py>=0.11.0.1; sys_platform == 'darwin' or (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'win32' and platform_machine == 'AMD64')",
    "uv>=0.12.23",
]

[tool.uv]
package = false
# Their sdist builds run an unlocked backend (shellcheck-py's also
# downloads the binary).
no-build-package = ["shellcheck-py", "uv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["hooks"]
addopts = ["-ra", "--strict-markers"]
